# 잡담 테마: 신뢰의 네이비 + 안정·성장의 틸, 따뜻한 오프화이트 배경과 파스텔 카드
[theme]
base = "light"
primaryColor = "#1E3A6E"
linkColor = "#1E3A6E"
backgroundColor = "#FAF8F4"
secondaryBackgroundColor = "#F1F4F8"
textColor = "#1F2937"
borderColor = "#E7E5E0"
blueColor = "#1E3A6E"
greenColor = "#0E8C83"
greenBackgroundColor = "#E2F3EF"
greenTextColor = "#0B6E67"
blueBackgroundColor = "#E6EEF8"
blueTextColor = "#1E3A6E"
chartCategoricalColors = ["#1E3A6E", "#0E8C83", "#8FB8DE", "#F2B8A0"]

showWidgetBorder = true
showSidebarBorder = false
baseRadius = "16px"
buttonRadius = "999px"
font = "'Noto Sans KR':https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
baseFontSize = 15
headingFontWeights = [700, 700, 700, 700, 600, 600]
linkUnderline = false
paddingTop = "2.5rem"
paddingBottom = "4rem"

[theme.sidebar]
backgroundColor = "#E6EEF8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E3A6E"
borderColor = "#D5E0EE"
paddingTop = "1.5rem"
