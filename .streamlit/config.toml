# 잡담 테마: 신뢰감을 주는 네이비 + 안정·성장을 뜻하는 틸, 여백 많은 화이트·라이트 그레이 배경
[theme]
base = "light"
primaryColor = "#1E3A6E"          # 네이비: 버튼, 선택 상태
linkColor = "#1E3A6E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F6F9"  # 라이트 그레이: 카드·입력창 바탕
textColor = "#1F2937"
borderColor = "#E2E8F0"
blueColor = "#1E3A6E"
greenColor = "#0E8C83"            # 틸: 강조 아이콘·배지
greenBackgroundColor = "#E3F4F2"
greenTextColor = "#0B6E67"
blueBackgroundColor = "#E8EEF7"
blueTextColor = "#1E3A6E"
chartCategoricalColors = ["#1E3A6E", "#0E8C83", "#7FA6C9", "#9CA3AF"]

showWidgetBorder = true
baseRadius = "12px"
buttonRadius = "12px"
font = "'Noto Sans KR':https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
baseFontSize = 15
headingFontWeights = [700, 700, 700, 600, 600, 600]
linkUnderline = false
paddingTop = "3rem"
paddingBottom = "4rem"
