# 잡담 테마: 어두운 별빛 배경 + 라임 포인트 (UX/UI 디자인 시안 반영)
# base = "dark" 고정이라 기기 설정과 상관없이 같은 화면으로 보입니다.
[theme]
base = "dark"
primaryColor = "#D9F477"
linkColor = "#D9F477"
backgroundColor = "#080808"
secondaryBackgroundColor = "#151612"
textColor = "#F5F3EA"
borderColor = "#2F3029"
grayColor = "#B1AFA3"
blueColor = "#D9F477"
blueBackgroundColor = "#232619"
blueTextColor = "#E7F8AD"
greenColor = "#D9F477"
greenBackgroundColor = "#1F2416"
greenTextColor = "#D9F477"
violetColor = "#BFC3FF"
orangeColor = "#EFCE97"
codeBackgroundColor = "#151612"
chartCategoricalColors = ["#D9F477", "#5A5C4E", "#EFCE97", "#BFC3FF"]

showWidgetBorder = true
showSidebarBorder = false
baseRadius = "12px"
buttonRadius = "999px"
font = "'Pretendard':https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
baseFontSize = 15
headingFontWeights = [760, 780, 760, 720, 680, 640]
headingFontSizes = ["2.6rem", "1.9rem", "1.4rem", "1.15rem", "1rem", "0.9rem"]
linkUnderline = false
paddingTop = "1.2rem"
paddingBottom = "4rem"

[theme.sidebar]
backgroundColor = "#0E0F0C"
secondaryBackgroundColor = "#151612"
textColor = "#F5F3EA"
borderColor = "#2F3029"
primaryColor = "#D9F477"
